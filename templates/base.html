{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Adventure Nepal | Explore Beyond{% endblock %}</title>
    <meta name="description" content="{% block description %}Explore Nepal's treks, wildlife, cultural journeys and destinations. Plan your next adventure with Adventure Nepal.{% endblock %}" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/variables.css' %}" />
    <link rel="stylesheet" href="{% static 'css/layout.css' %}" />
    <link rel="stylesheet" href="{% static 'css/components.css' %}" />
    <link rel="stylesheet" href="{% static 'css/sections/featured.css' %}" />
    <link rel="stylesheet" href="{% static 'css/sections/footer.css' %}" />
    <link rel="stylesheet" href="{% static 'css/pages/adventures.css' %}" />
    <link rel="stylesheet" href="{% static 'css/pages/forms.css' %}" />
    <link rel="stylesheet" href="{% static 'css/main.css' %}" />
    {% include "includes/page_styles.html" %}
    <link rel="stylesheet" href="{% static 'css/responsive/tablet.css' %}" />
    <link rel="stylesheet" href="{% static 'css/responsive/mobile.css' %}" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include "includes/navbar.html" %}

    <main id="main-content" tabindex="-1">{% block content %} {% endblock %}</main>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
    <script src="{% static 'js/main.js' %}" defer></script>
    <script src="{% static 'js/navbar.js' %}" defer></script>

    {% block extra_js %}{% endblock %}

  </body>
</html>
