{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Pagination">
  {% if page_obj.has_previous %}<a class="pagination__link" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page_obj.previous_page_number }}" rel="prev" aria-label="Previous page"><i data-lucide="chevron-left" aria-hidden="true"></i></a>{% endif %}
  <span class="pagination__summary">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="pagination__link" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page_obj.next_page_number }}" rel="next" aria-label="Next page"><i data-lucide="chevron-right" aria-hidden="true"></i></a>{% endif %}
</nav>
{% endif %}
